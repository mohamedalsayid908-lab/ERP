<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>الرئيسية</title><link rel=stylesheet href=style.css><script src=https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js></script><script src=app.js></script></head><body><div id=nav></div><main id=app></main><script>
let D={};
async function load(){const d30=new Date(Date.now()-30*864e5).toISOString();
 const [t,tr,b,ins,sl,rc,pf,wh,sup]=await Promise.all([all('treasury_tx?select=kind,amount&order=id'),all('transfers?select=dir,amount&order=id'),all('stock_balance'),api('installments?paid=eq.false&select=amount,due_date'),
  all('sales_invoices?select=total,created_at&order=id&created_at=gte.'+encodeURIComponent(d30)),api('treasury_tx?select=*&order=id.desc&limit=8'),PROFIT(CUR.start_at,new Date().toISOString()),api('warehouses?active=eq.true&select=id'),api('suppliers?select=id')]);
 D={t,tr,b,ins,sl,rc,pf,wh,sup}}
const day=d=>new Date(d).toLocaleDateString('en-CA');
function render(){const bal=sum(D.t,x=>x.kind=='in'?x.amount:-x.amount),tb=sum(D.tr,x=>x.dir=='in'?x.amount:-x.amount),low=D.b.filter(x=>x.qty<=x.min_qty),due=D.ins.filter(x=>x.due_date<=td()),
 today=sum(D.sl.filter(x=>day(x.created_at)==td()),x=>x.total),month=sum(D.sl.filter(x=>day(x.created_at).slice(0,7)==td().slice(0,7)),x=>x.total),
 days=[...Array(7)].map((_,i)=>{const d=day(Date.now()-(6-i)*864e5);return{d:d.slice(5),v:sum(D.sl.filter(x=>day(x.created_at)==d),x=>x.total)}}),mx=Math.max(1,...days.map(x=>x.v));
 const C=(h,l,x,ic,cl='')=>`<a class="stat ${cl}" href="${h}"><span>${ic}</span>${l}<b>${x}</b></a>`;
 $('#app').innerHTML=`<div class="cards">
 ${C('treasury.html#rep','رصيد الخزينة',fm(bal),'▣')}${C('treasury.html#rep','رصيد التحويلات',fm(tb),'⇄','b')}${C('sales.html#rep:inv','مبيعات اليوم',fm(today),'◈')}${C('sales.html#rep:inv','مبيعات الشهر',fm(month),'◉')}
 ${C('partners.html#profit','صافي ربح الفترة الحالية',fm(D.pf.net),'▲')}${C('warehouses.html#rep:low','أصناف قاربت على النفاذ',low.length,'⚠',low.length?'r':'')}${C('purchases.html#due','دفعات مستحقة اليوم',due.length+' ('+fm(sum(due,x=>x.amount))+')','⏰',due.length?'w':'')}
 ${C('purchases.html#due','إجمالي مستحق للموردين',fm(sum(D.ins,x=>x.amount)),'◧','w')}${C('warehouses.html#stores','المخازن / الأصناف',D.wh.length+' / '+D.b.length,'▤')}${C('partners.html#accounts','الشركاء النشطون',PT.length,'☺')}</div>
 <div class="dash"><section><h3>المبيعات آخر 7 أيام</h3><div class="bars">${days.map(x=>`<div>${x.v?fm(x.v):''}<i style="height:${Math.round(x.v/mx*120)}px"></i>${x.d}</div>`).join('')}</div></section>
 <section><h3>آخر حركات الخزينة</h3>${TB(D.rc,{date:'التاريخ',k:['',x=>x.kind=='in'?BD('وارد','ok'):BD('صادر','bad')],amount:['المبلغ',x=>fm(x.amount)],note:'البيان'})}</section></div>`}
boot('index').then(async()=>{await load();render()});
</script></body></html>
