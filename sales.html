<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>المبيعات</title><link rel=stylesheet href=style.css><script src=https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js></script><script src=app.js></script></head><body><div id=nav></div><main id=app></main><script>
let D={},L=[];PML.none='لا يُسجَّل';
async function load(){const [c,i,b,bt,si,w,rt]=await Promise.all([api('customers?order=id'),all('items?active=eq.true&order=id'),all('stock_balance'),api('purchase_lines?remaining=gt.0&order=id&select=item_id,sell'),
 all('sales_invoices?select=*,customers(name,code,phone)&order=id.desc'),api('warehouses?active=eq.true&order=id'),all('sales_returns?order=id')]);
 D={cus:c,items:i,bal:b,bt:{},inv:si,wh:w,ret:rt};bt.forEach(x=>D.bt[x.item_id]??=x)}
const FI=q=>D.items.find(x=>x.code==q||x.name==q),CU=q=>D.cus.find(x=>x.name==q||x.code==q),cp=it=>D.bt[it.id]?.sell??it.sell,avail=it=>sum(D.bal.filter(x=>x.item_id==it.id),x=>x.qty);
const rets=id=>sum(D.ret.filter(r=>r.inv_id==id),r=>r.total),disc=()=>ST.allow_discount?n('#dc'):0,tot=()=>sum(L,l=>l.q*l.p);
function cuPick(){const c=CU(v('#cn'));$('#cph').value=c?.phone||'';$('#cph').readOnly=!!c;$('#ctag').innerHTML=c?BD('عميل مسجل — كود '+c.code,'ok'):v('#cn')?BD('عميل جديد سيُضاف بكود تلقائي','info'):''}
function pick(){const it=FI(v('#li'));if(it){$('#li').value=it.name;$('#lp').value=cp(it);$('#lav').innerHTML=BD('المتاح: '+fm(avail(it)),avail(it)>0?'ok':'bad')}}
function addL(){const it=FI(v('#li'));if(!it)return toast('الصنف غير موجود');const q=n('#lq'),ex=L.find(l=>l.it.id==it.id);if(q<=0)return toast('أدخل العدد');
 if(avail(it)<q+(ex?ex.q:0))return toast('الرصيد المتاح: '+fm(avail(it)));if(ex){ex.q+=q;ex.p=n('#lp')||ex.p}else L.push({it,q,p:n('#lp')||cp(it)});drawL();$('#li').value='';$('#lav').innerHTML=''}
function drawL(){const f=1-disc()/100,t=tot();$('#lt').innerHTML=(L.length?TB(L.map((l,i)=>({...l,nm:l.it.name,t:l.q*l.p,i})),{nm:'الصنف',q:'الكمية',p:'السعر',t:'الإجمالي',x:['',r=>`<button class="d s" onclick="L.splice(${r.i},1);drawL()">حذف</button>`]}):EMPTY('لم تُضف أصناف بعد'))+
 `<div class="sumbar np"><div><small>الإجمالي${disc()?' بعد خصم '+disc()+'%':''}</small><b>${fm(t*f)}</b></div><button onclick="go(saveSale)">تنفيذ الفاتورة</button></div>`}
async function saveSale(){if(!L.length)throw Error('أضف أصنافاً');const cn=v('#cn');if(!cn)throw Error('اسم العميل مطلوب');const pv=PMV('s');
 for(const l of L)if(avail(l.it)<l.q)throw Error('الرصيد غير كاف: '+l.it.name);
 const c=await ENS('customers',cn,{phone:v('#cph')||null}),d=disc(),f=1-d/100,total=+(tot()*f).toFixed(2);
 const inv=(await post('sales_invoices',{customer_id:c.id,discount_pct:d,total,mode:pv.via,note:v('#sn2')||null}))[0];
 for(const l of L){const {cost}=await take(l.it.id,l.q);await post('sales_lines',{inv_id:inv.id,item_id:l.it.id,qty:l.q,price:+(l.p*f).toFixed(4),cost});
  let left=l.q;for(const b of D.bal.filter(x=>x.item_id==l.it.id&&x.qty>0).sort((a,b)=>b.qty-a.qty)){const t=Math.min(left,b.qty);if(t<=0)break;await post('stock_moves',mv(l.it.id,b.wh_id,-t,'sale',inv.id,'فاتورة بيع '+inv.id));left-=t}}
 await PAY('in',pv.via,total,{source:'sale',party:'C:'+c.id,inv_id:inv.id,note:'فاتورة بيع '+inv.id+(v('#sn2')?' — '+v('#sn2'):''),ref:pv.ref},[]);L=[];printInv(inv.id)}
async function printInv(id){const [i]=await api('sales_invoices?select=*,customers(name,phone),sales_lines(qty,price,items(name))&id=eq.'+id);
 PRINTDOC('فاتورة بيع رقم '+id,`العميل: ${esc(i.customers.name)} ${esc(i.customers.phone||'')} — التاريخ: ${i.date}${i.discount_pct>0?' — خصم '+i.discount_pct+'%':''}`,i.sales_lines.map(l=>({name:l.items.name,qty:l.qty,price:fm(l.price),tot:fm(l.qty*l.price)})),i.total)}
// ---- المرتجع
function searchInv(){const q=v('#rq').toLowerCase(),f=v('#rf'),g=v('#rg2');
 const r=D.inv.filter(x=>(!q||String(x.id)==q||x.customers.name.toLowerCase().includes(q)||x.customers.code.toLowerCase()==q||(x.customers.phone||'').includes(q))&&(!f||x.date>=f)&&(!g||x.date<=g)).slice(0,40);
 $('#rl').innerHTML=TB(r,{id:'رقم',date:'التاريخ',c:['العميل',x=>esc(x.customers.name)],total:['الإجمالي',x=>fm(x.total)],a:['',x=>`<button class="s" onclick="loadSR(${x.id})">اختيار</button>`]})}
async function loadSR(id){D.ri=id;D.rl=await api('sales_lines?select=*,items(name,wh_id)&order=id&inv_id=eq.'+id);
 $('#rl').innerHTML=HR('أصناف الفاتورة رقم '+id)+TB(D.rl,{i:['الصنف',x=>esc(x.items.name)],qty:'الكمية',returned:'سبق إرجاعه',price:'السعر',z:['كمية المرتجع',x=>`<input type="number" step="any" min="0" max="${x.qty-x.returned}" id="rq${x.id}" value="0" style="min-width:110px">`]})+FG(PM('r',['cash','ext'],'رد المبلغ من')+ACT('<button onclick="go(doSR)">تنفيذ المرتجع</button>'));pmx('r')}
async function doSR(){const inv=D.ri,iv=D.inv.find(x=>x.id==inv),pv=PMV('r'),items=[];let t=0;
 for(const l of D.rl){const q=n('#rq'+l.id);if(q<=0)continue;if(q>l.qty-l.returned)throw Error('كمية المرتجع أكبر من المباعة');items.push([l,q]);t+=q*l.price}if(!t)throw Error('حدد كمية المرتجع');
 const ret=(await post('sales_returns',{inv_id:inv,total:+t.toFixed(2)}))[0];
 for(const [l,q] of items){await post('sales_return_lines',{ret_id:ret.id,line_id:l.id,item_id:l.item_id,qty:q,price:l.price,cost:l.cost});await patch('sales_lines','id=eq.'+l.id,{returned:l.returned+q});
  await post('stock_moves',mv(l.item_id,l.items.wh_id,q,'sale_return',inv,'مرتجع فاتورة بيع '+inv));await addBatch(l.item_id,q,l.cost,l.price,l.items.wh_id)}
 await PAY('out',pv.via,t,{source:'sale_return',party:'C:'+iv.customer_id,inv_id:inv,note:'مرتجع فاتورة بيع '+inv,ref:pv.ref},[]);$('#rl').innerHTML=''}
// ---- الكونتينر المباشر
async function autoWh(){let w=(await api('warehouses?active=eq.true&name=eq.'+encodeURIComponent('كونتينر بيع مباشر')))[0];
 if(!w){const used=D.wh.map(x=>x.code),c=[...'ZYXWVUTSRQPONMLKJIHGFEDCBA'].find(x=>!used.includes(x));w=(await post('warehouses',{code:c,name:'كونتينر بيع مباشر'}))[0]}
 let k=(await api('categories?active=eq.true&wh_id=eq.'+w.id+'&limit=1'))[0];if(!k)k=(await post('categories',{wh_id:w.id,code:'K',name:'حاويات'}))[0];return[w,k]}
async function saveCont(){const ty=v('#kt'),b=n('#kb'),s=n('#kp');if(!ty||!v('#kseller')||!v('#kbuyer')||s<=0)throw Error('أكمل البيانات: النوع وسعر البيع والبائع والمشتري');const pc=PMV('kc'),pr=PMV('kv');
 const [w,k]=await autoWh(),sel=await ENS('customers',v('#kseller'),{phone:v('#ksp')||null}),buy=await ENS('customers',v('#kbuyer'),{phone:v('#kbp')||null});
 const inv=(await post('sales_invoices',{customer_id:buy.id,total:s,mode:pr.via,kind:'container',note:v('#kn')||null}))[0];
 const it=(await post('items',{name:ty+' #'+inv.id,wh_id:w.id,cat_id:k.id,buy:b,sell:s,min_qty:0}))[0];
 await post('stock_moves',mv(it.id,w.id,1,'container_in',inv.id,'شراء من '+sel.name));await post('stock_moves',mv(it.id,w.id,-1,'container_out',inv.id,'بيع إلى '+buy.name));
 await post('sales_lines',{inv_id:inv.id,item_id:it.id,qty:1,price:s,cost:b});await post('sales_containers',{inv_id:inv.id,ctype:ty,buy:b,sell:s,seller_id:sel.id,buyer_id:buy.id});
 if(pc.via!='none'&&b>0)await PAY('out',pc.via,b,{source:'purchase',party:'C:'+sel.id,inv_id:inv.id,note:'شراء كونتينر (فاتورة '+inv.id+') من '+sel.name,ref:pc.ref},[]);
 await PAY('in',pr.via,s,{source:'sale',party:'C:'+buy.id,inv_id:inv.id,note:'بيع كونتينر (فاتورة '+inv.id+') إلى '+buy.name,ref:pr.ref},[]);printInv(inv.id)}
// ---- حذف فاتورة (للمدير) مع عكس الأثر
async function delSI(id){if(!confirm('حذف الفاتورة رقم '+id+' نهائياً؟ سيُخصم الإيراد من الخزينة/التحويلات وتعود الكميات للمخزون.'))return false;
 const ls=await api('sales_lines?select=*,items(sell)&inv_id=eq.'+id);for(const l of ls){const q=l.qty-l.returned;if(q>0)await addBatch(l.item_id,q,l.cost,l.items.sell,null)}
 await del('treasury_tx',`inv_id=eq.${id}&source=in.(sale,sale_return)`);await del('transfers',`inv_id=eq.${id}&source=in.(sale,sale_return)`);await del('stock_moves',`ref=eq.${id}&kind=in.(sale,sale_return)`);
 const rs=await api('sales_returns?select=id&inv_id=eq.'+id);for(const r of rs)await del('sales_return_lines','ret_id=eq.'+r.id);await del('sales_returns','inv_id=eq.'+id);
 await del('sales_containers','inv_id=eq.'+id);await del('sales_lines','inv_id=eq.'+id);await del('sales_invoices','id=eq.'+id)}
// ---- التقارير
async function showRep(){const t=v('#rt'),cid=n('#rc'),fr=FR();let rows,cols,title,o={};
 if(t=='inv'){title='فواتير البيع';rows=D.inv.filter(x=>inR(x,fr)&&(!cid||x.customer_id==cid)).map(x=>({...x,cn:x.customers.name,kd:x.kind=='container'?'كونتينر':'عادية',md:x.mode=='ext'?'تحويل':'خزينة',rt:rets(x.id),nt:x.total-rets(x.id)}));
  cols={id:'رقم',date:'التاريخ',cn:'العميل',kd:'النوع',note:'البيان',discount_pct:'خصم %',total:'الإجمالي',rt:'المرتجع',nt:'الصافي',md:'التحصيل',a:['',x=>`<button class="g s" onclick="printInv(${x.id})">طباعة</button>`+(ISADM()?` <button class="d s" onclick="go(()=>delSI(${x.id}))">حذف</button>`:'')]};o={num:['discount_pct','total','rt','nt'],tot:['total','rt','nt']}}
 if(t=='itm'){title='المبيعات حسب الصنف';const [a,b]=fr,l=await all('sales_lines?select=qty,price,cost,items(code,name),sales_invoices!inner(created_at,customer_id)&order=id&sales_invoices.created_at=gte.'+encodeURIComponent(a.toISOString())+'&sales_invoices.created_at=lte.'+encodeURIComponent(b.toISOString())),g={};
  l.filter(x=>!cid||x.sales_invoices.customer_id==cid).forEach(x=>{const r=g[x.items.code]??={cd:x.items.code,nm:x.items.name,q:0,rev:0,cost:0};r.q+=x.qty;r.rev+=x.qty*x.price;r.cost+=x.qty*x.cost});
  rows=Object.values(g).map(r=>({...r,pf:r.rev-r.cost}));cols={cd:'الكود',nm:'الصنف',q:'الكمية المباعة',rev:'الإيراد',cost:'التكلفة',pf:'الربح'};o={num:['q','rev','cost','pf'],tot:['q','rev','cost','pf']}}
 if(t=='cus'){if(!cid)return toast('اختر العميل');const c=D.cus.find(x=>x.id==cid);title='كشف حساب عميل: '+c.name;
  const inv=D.inv.filter(x=>x.customer_id==cid),r=D.ret.filter(x=>inv.some(i=>i.id==x.inv_id)),all_=[...inv.map(x=>({ts:x.created_at,d:x.date,t:'فاتورة بيع #'+x.id+(x.note?' — '+x.note:''),a:x.total,k:'i'})),...r.map(x=>({ts:x.created_at,d:x.date,t:'مرتجع فاتورة #'+x.inv_id,a:-x.total,k:'r'}))].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  rows=withOpening(all_,fr[0]);cols={d:'التاريخ',t:'البيان',dr:'مشتريات',cr:'مرتجعات',b:'الصافي التراكمي'};o={num:['dr','cr','b'],tot:['dr','cr'],sub:SUMC([['إجمالي المشتريات',sum(all_.filter(x=>x.k=='i'),x=>x.a)],['إجمالي المرتجعات',-sum(all_.filter(x=>x.k=='r'),x=>x.a)],['الصافي',sum(all_,x=>x.a)]])+`<p class="hint">${esc(c.name)} — ${esc(c.code)} — ${esc(c.phone||'')} (المبيعات تُحصَّل عند الفاتورة، فلا مديونية)</p>`}}
 if(t=='con'){title='فواتير الكونتينر المباشر';rows=(await api('sales_containers?select=*,sales_invoices(created_at,date),seller:customers!seller_id(name),buyer:customers!buyer_id(name)&order=id.desc')).filter(x=>inR(x.sales_invoices,fr)).map(x=>({...x,d:x.sales_invoices.date,sn:x.seller.name,bn:x.buyer.name,pf:x.sell-x.buy}));
  cols={inv_id:'فاتورة',d:'التاريخ',ctype:'النوع',sn:'اشتُري من',bn:'بيع إلى',buy:'سعر الشراء',sell:'سعر البيع',pf:'الربح'};o={num:['buy','sell','pf'],tot:['buy','sell','pf']}}
 if(t=='cl'){title='العملاء';rows=D.cus.map(c=>{const a=D.inv.filter(i=>i.customer_id==c.id);return{...c,n:a.length,tt:sum(a,i=>i.total-rets(i.id))}});cols={code:'الكود',name:'العميل',phone:'الهاتف',n:'عدد الفواتير',tt:'صافي المشتريات'};o={num:['n','tt'],tot:['n','tt']}}
 if(t=='prf'){title='أرباح المبيعات';const p=await PROFIT(fr[0].toISOString(),fr[1].toISOString());$('#rp').innerHTML=REP('s',title,grp(p.recs,v('#gp')=='m'?7:10).concat([{d:'الإجمالي',sales:p.sales,cost:p.cost,gross:p.gross,exp:p.exp,net:p.net}]),PCOLS,{num:Object.keys(PCOLS).slice(1)});return}
 $('#rp').innerHTML=REP('s',title,rows,cols,o)}
function render(){const h=location.hash.split(':')[1],dl=ST.allow_discount?`<label>الخصم<select id="dc" onchange="drawL()"><option value="0">بدون خصم</option>${(ST.discounts||[]).map(x=>`<option value="${x}">${x}%</option>`).join('')}</select></label>`:'';
 $('#app').innerHTML=`<datalist id="dl">${D.items.map(x=>`<option value="${esc(x.code)}">${esc(x.name)} — المتاح ${fm(avail(x))}</option>`).join('')}</datalist><datalist id="cl">${D.cus.map(x=>`<option value="${esc(x.name)}">${esc(x.code)}</option>`).join('')}</datalist>`+
 SEC('فاتورة بيع',`${HR('١ — العميل والتحصيل')}${FG(F('cn','العميل (اكتب الاسم أو الكود)','text','list=cl onchange="cuPick()" oninput="cuPick()"')+F('cph','هاتف العميل')+dl+F('sn2','بيان الفاتورة (اختياري)')+PM('s',['cash','ext'],'طريقة التحصيل',true))}<div id="ctag" class="act"></div>
 ${HR('٢ — أصناف الفاتورة')}${FG(F('li','الصنف (اسم أو كود — تظهر اقتراحات)','text','list=dl onchange="pick()"')+F('lq','العدد','number','value=1 step=any')+F('lp','السعر','number','step=any')+'<div id="lav" class="act"></div>'+ACT('<button onclick="addL()">+ إضافة للفاتورة</button>'))}<div id="lt"></div>`,'new')+
 SEC('بيع كونتينر مباشر',`${FG(F('kt','نوع الكونتينر')+F('kb','سعر الشراء','number','step=any')+F('kp','سعر البيع','number','step=any')+F('kn','بيان (اختياري)'))}
 <div class="two"><div><h4>العميل الذي اشتُري منه</h4>${FG(F('kseller','الاسم (جديد أو مسجل)','text','list=cl')+F('ksp','الهاتف'))}${FG(PM('kc',['cash','ext','none'],'دفع ثمن الشراء'))}</div>
 <div><h4>العميل المشتري</h4>${FG(F('kbuyer','الاسم (جديد أو مسجل)','text','list=cl')+F('kbp','الهاتف'))}${FG(PM('kv',['cash','ext'],'تحصيل ثمن البيع',true))}</div></div>${ACT('<button onclick="go(saveCont)">تنفيذ الفاتورة</button>')}<p class="hint">يُنشأ تلقائياً مخزن «كونتينر بيع مباشر» وتظهر حركة إضافة الكونتينر وصرفه. سعر الشراء لا يظهر في الطباعة.</p>`,'cont')+
 SEC('مرتجع فاتورة بيع',`${FG(F('rq','رقم الفاتورة أو اسم/كود/هاتف العميل')+F('rf','من تاريخ','date')+F('rg2','إلى تاريخ','date')+ACT('<button onclick="searchInv()">بحث</button>'))}<div id="rl"></div>`,'ret')+
 SEC('التقارير',`${HR('فلتر التقرير')}${FBAR(`<label>التقرير<select id="rt"><option value="inv">فواتير البيع</option><option value="itm">المبيعات حسب الصنف</option><option value="cus">كشف حساب عميل</option><option value="cl">العملاء</option><option value="con">فواتير الكونتينر</option><option value="prf">الأرباح (يومي / شهري)</option></select></label>${SL('rc','العميل',[{id:0,name:'كل العملاء'},...D.cus])}<label>التجميع<select id="gp"><option value="d">يومي</option><option value="m">شهري</option></select></label>`)}${HR('النتائج')}<div id="rp"></div>`,'rep');
 ['s','kc','kv'].forEach(pmx);drawL();cuPick();if(h&&$('#rt'))$('#rt').value=h;showRep()}
boot('sales').then(async()=>{await load();render()});
</script></body></html>
